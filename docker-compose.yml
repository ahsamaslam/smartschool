services:
  # ============================================
  # PostgreSQL — auto-initialises with schema + seed
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: smart_school_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_school
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Persistent data volume
      - postgres_data:/var/lib/postgresql/data
      # Init scripts — executed once in alphabetical order on first start
      # schema.docker.sql strips Supabase-only RLS policies (auth.uid())
      - ./database/schema.docker.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_school"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================
  # Redis — session cache + AI curriculum context
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: smart_school_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================
  # Backend — FastAPI (uncomment to containerise)
  # ============================================
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: smart_school_api
  #   restart: unless-stopped
  #   env_file: ./backend/.env
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
  redis_data:
